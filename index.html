<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse de l'Historique d'Écoute</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- jsPDF et html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Styles persos -->
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="container my-3">
        <h1 class="text-center animate__animated animate__fadeInDown">
            Analyse de l'Historique d'Écoute
        </h1>

        <!-- Sélection JSON -->
        <div class="card p-4 mb-3">
            <div class="d-flex justify-content-center align-items-center">
                <input type="file" id="fileInput" accept=".json" class="d-none"/>
                <label for="fileInput" class="btn btn-primary">
                    <i class="fas fa-upload"></i> Choisir un fichier JSON
                </label>
            </div>
        </div>

        <!-- Filtres -->
        <div id="advancedFilters" class="hidden card p-4 mb-3">
            <div class="row mb-3">
                <div class="col-sm-6 col-lg-3">
                    <label>Recherche par artiste</label>
                    <input type="text" id="artistFilter" class="form-control"/>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label>Recherche par mot-clé</label>
                    <input type="text" id="keywordFilter" class="form-control"/>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label>Date début</label>
                    <input type="date" id="startDate" class="form-control"/>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label>Date fin</label>
                    <input type="date" id="endDate" class="form-control"/>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-6 col-lg-3">
                    <label>Type du graphique (écoute mensuelle)</label>
                    <select id="monthlyChartType" class="form-select">
                        <option value="line">Line</option>
                        <option value="bar">Bar</option>
                        <option value="radar">Radar</option>
                        <option value="polarArea">PolarArea</option>
                        <option value="doughnut">Doughnut</option>
                        <option value="pie">Pie</option>
                    </select>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label>Type du graphique (top artistes)</label>
                    <select id="artistChartType" class="form-select">
                        <option value="bar">Bar</option>
                        <option value="doughnut">Doughnut</option>
                        <option value="pie">Pie</option>
                        <option value="polarArea">PolarArea</option>
                        <option value="line">Line</option>
                        <option value="radar">Radar</option>
                    </select>
                </div>
            </div>
            <button id="applyFiltersBtn" class="btn btn-success mt-3">Appliquer</button>
        </div>

        <!-- Stats -->
        <div id="stats" class="hidden">
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title">Statistiques Générales</h2>
                    <div class="row">
                        <div class="col-md-4">
                            <p><strong>Heures d'écoute :</strong> <span id="totalHours">0</span> h</p>
                        </div>
                        <div class="col-md-4">
                            <p><strong>Nombre total de lectures :</strong> <span id="totalPlays">0</span></p>
                        </div>
                        <div class="col-md-4">
                            <p><strong>Artiste le plus écouté :</strong> <span id="topArtist">N/A</span></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Top 5 -->
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title">Top 5 Titres</h2>
                    <ul id="favorites"></ul>
                </div>
            </div>

            <!-- Historique -->
            <div class="card mb-3">
                <div class="card-body">
                    <h2 class="card-title">Historique Complet</h2>
                    <div id="historyList" style="max-height:300px; overflow:auto;"></div>
                </div>
            </div>

            <!-- Graphiques -->
            <div class="row mb-3">
                <div class="col-lg-6 col-sm-12 mb-3">
                    <canvas id="listeningTimeChart"></canvas>
                </div>
                <div class="col-lg-6 col-sm-12 mb-3">
                    <canvas id="genreChart"></canvas>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-lg-6 col-sm-12 mb-3">
                    <select class="form-select mb-2" id="weeklyChartType">
                        <option value="bar">Bar</option>
                        <option value="doughnut">Doughnut</option>
                        <option value="pie">Pie</option>
                        <option value="polarArea">PolarArea</option>
                        <option value="line">Line</option>
                        <option value="radar">Radar</option>
                    </select>
                    <canvas id="dayOfWeekChart"></canvas>
                </div>
                <div class="col-lg-6 col-sm-12 mb-3">
                    <select class="form-select mb-2" id="hourlyChartType">
                        <option value="bar">Bar</option>
                        <option value="doughnut">Doughnut</option>
                        <option value="pie">Pie</option>
                        <option value="polarArea">PolarArea</option>
                        <option value="bubble">Bubble</option>
                        <option value="scatter">Scatter</option>
                        <option value="line">Line</option>
                        <option value="radar">Radar</option>
                    </select>
                    <canvas id="hourOfDayChart"></canvas>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-12">
                    <select class="form-select mb-2" id="albumChartType">
                        <option value="bar">Bar</option>
                        <option value="doughnut">Doughnut</option>
                        <option value="pie">Pie</option>
                        <option value="polarArea">PolarArea</option>
                        <option value="line">Line</option>
                        <option value="radar">Radar</option>
                    </select>
                    <canvas id="topAlbumChart"></canvas>
                </div>
            </div>

            <!-- Boutons d'export/partage -->
            <div class="d-flex justify-content-center">
                <button id="exportPdfBtn" class="btn btn-danger mx-1">Exporter en PDF</button>
                <button id="exportImageBtn" class="btn btn-primary mx-1">Exporter en Image</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script principal -->
    <script src="script.js"></script>
</body>
</html>
